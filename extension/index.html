<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Flag Scanner</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="popup">
        <header class="header">
            <h1 class="title">Red Flag Scanner</h1>
            <p class="subtitle">AI-powered Terms & Conditions risk analysis</p>
        </header>

        <main class="main">
            <section id="view-input" class="view">
                <button id="btn-analyze-page" class="btn btn-primary">Analyze This Page</button>
                <div class="divider"><span>or</span></div>
                <textarea id="text-input" class="textarea"
                    placeholder="Paste Terms & Conditions text here (optional fallback)"></textarea>
                <button id="btn-analyze-text" class="btn btn-secondary">Analyze Pasted Text</button>
            </section>

            <section id="view-loading" class="view view-center hidden">
                <div class="spinner"></div>
                <p class="status-text">Analyzing document…</p>
                <p class="status-subtext">This may take a few seconds</p>
            </section>

            <section id="view-error" class="view view-center hidden">
                <p class="status-text">Unable to analyze this content.</p>
                <p class="status-subtext">Make sure the backend server is running.</p>
                <button id="btn-retry" class="btn btn-secondary btn-small">Try Again</button>
            </section>

            <section id="view-results" class="view hidden">
                <div class="risk-banner">
                    <span class="risk-label">Overall Risk:</span>
                    <span id="overall-risk" class="badge badge-high">HIGH</span>
                </div>

                <h2 class="section-heading">Key Findings</h2>
                <ul id="summary-list" class="summary-list">
                    <!-- Summary items rendered by JS -->
                </ul>

                <h2 class="section-heading">Flagged Clauses</h2>
                <ul id="clauses-list" class="clauses-list">
                    <!-- Clauses rendered by JS -->
                </ul>

                <button id="btn-new-analysis" class="btn btn-secondary">Start New Analysis</button>
            </section>
        </main>

        <footer class="footer">Internal Compliance Tool v1.0</footer>
    </div>
    <script src="index.js"></script>
</body>

</html>
